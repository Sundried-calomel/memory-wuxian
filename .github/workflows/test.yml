name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --manifest-path native-collector/Cargo.toml
      - run: cargo check --locked --all-targets --manifest-path native-collector/Cargo.toml
      - run: cargo test --locked --manifest-path native-collector/Cargo.toml
      - run: cargo build --locked --bins --manifest-path native-collector/Cargo.toml
      - run: python scripts/check_documentation_contract.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_release_rehearsal.py --output outputs/rehearsal/${{ matrix.os }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rehearsal-${{ matrix.os }}
          path: outputs/rehearsal/${{ matrix.os }}

  documentation-change-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: >-
          python scripts/check_documentation_changes.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
