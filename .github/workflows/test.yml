name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --manifest-path native-collector/Cargo.toml
      - run: cargo check --locked --all-targets --manifest-path native-collector/Cargo.toml
      - run: cargo test --locked --manifest-path native-collector/Cargo.toml
      - run: cargo build --locked --bins --manifest-path native-collector/Cargo.toml
      - name: Build packaged macOS candidate binaries
        if: matrix.os == 'macos-latest'
        run: ./scripts/build_native_collector.sh
      - run: python scripts/check_documentation_contract.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_release_rehearsal.py --output outputs/rehearsal/${{ matrix.os }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rehearsal-${{ matrix.os }}
          path: outputs/rehearsal/${{ matrix.os }}

  windows-native:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        stage: [check, test]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: matrix.stage == 'check'
        run: cargo fmt --check --manifest-path native-collector/Cargo.toml
      - if: matrix.stage == 'check'
        run: cargo check --locked --all-targets --manifest-path native-collector/Cargo.toml
      - if: matrix.stage == 'test'
        run: cargo test --locked --manifest-path native-collector/Cargo.toml
      - if: matrix.stage == 'test'
        run: cargo build --locked --bins --manifest-path native-collector/Cargo.toml

  windows-python:
    needs: windows-native
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7"
      - run: python scripts/run_unittest_shard.py --index ${{ matrix.shard }} --count 6

  windows-rehearsal:
    needs: windows-python
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7"
      - run: >-
          python scripts/run_release_rehearsal.py
          --output outputs/rehearsal/windows-2022-${{ matrix.shard }}
          --exclude-baseline
          --scenario-shard-index ${{ matrix.shard }}
          --scenario-shard-count 6
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rehearsal-windows-2022-${{ matrix.shard }}
          path: outputs/rehearsal/windows-2022-${{ matrix.shard }}

  python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7"
      - run: python -m compileall -q scripts
      - run: python -m unittest discover -s tests -v

  documentation-change-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: >-
          python scripts/check_documentation_changes.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
