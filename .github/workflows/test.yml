name: test

on:
  push:
    branches: [main, codex/v2191-install-fix]
  pull_request:

concurrency:
  group: memory-wuxian-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-candidate:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - id: validation-profile
        shell: bash
        run: echo "profile=$(python scripts/run_release_rehearsal.py --print-validation-profile)" >> "$GITHUB_OUTPUT"
      - run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --manifest-path native-collector/Cargo.toml
      - run: cargo check --locked --all-targets --manifest-path native-collector/Cargo.toml
      - if: steps.validation-profile.outputs.profile != 'targeted-patch'
        run: cargo test --locked --manifest-path native-collector/Cargo.toml
      - run: cargo build --locked --bins --manifest-path native-collector/Cargo.toml
      - run: python scripts/check_documentation_contract.py
      - name: Run full Python suite once
        if: steps.validation-profile.outputs.profile != 'targeted-patch'
        shell: bash
        run: |
          mkdir -p outputs/baseline
          source_hash="$(python scripts/run_release_rehearsal.py --print-source-content-sha256)"
          printf 'SOURCE_CONTENT_SHA256=%s\n' "$source_hash" > outputs/baseline/unittest.log
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 \
            | tee -a outputs/baseline/unittest.log
      - name: Build rehearsal evidence without rerunning unittest modules
        if: steps.validation-profile.outputs.profile != 'targeted-patch'
        run: >-
          python scripts/run_release_rehearsal.py
          --output outputs/rehearsal/ubuntu-latest
          --exclude-baseline
          --reuse-unittest-evidence outputs/baseline/unittest.log
      - name: Run bounded patch impact rehearsal
        if: steps.validation-profile.outputs.profile == 'targeted-patch'
        run: >-
          python scripts/run_release_rehearsal.py
          --contract-profile
          --output outputs/rehearsal/ubuntu-latest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-evidence-ubuntu
          path: outputs

  windows-candidate:
    timeout-minutes: 25
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - id: validation-profile
        shell: pwsh
        run: |
          "profile=$(& python scripts/run_release_rehearsal.py --print-validation-profile)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --manifest-path native-collector/Cargo.toml
      - run: cargo check --locked --all-targets --manifest-path native-collector/Cargo.toml
      - if: steps.validation-profile.outputs.profile != 'targeted-patch'
        run: cargo test --locked --manifest-path native-collector/Cargo.toml
      - run: cargo build --locked --bins --manifest-path native-collector/Cargo.toml
      - name: Build packaged Windows candidate binaries
        shell: pwsh
        run: ./scripts/build_native_collector.ps1
      - name: Run full Python suite once
        if: steps.validation-profile.outputs.profile != 'targeted-patch'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force outputs/baseline | Out-Null
          $sourceHash = (& python scripts/run_release_rehearsal.py --print-source-content-sha256).Trim()
          Set-Content -LiteralPath outputs/baseline/unittest.log -Value "SOURCE_CONTENT_SHA256=$sourceHash" -Encoding utf8
          & python -m unittest discover -s tests -v *>&1 |
            Tee-Object -Append outputs/baseline/unittest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build rehearsal evidence without rerunning unittest modules
        if: steps.validation-profile.outputs.profile != 'targeted-patch'
        run: >-
          python scripts/run_release_rehearsal.py
          --output outputs/rehearsal/windows-2022
          --exclude-baseline
          --reuse-unittest-evidence outputs/baseline/unittest.log
      - name: Run bounded patch impact rehearsal
        if: steps.validation-profile.outputs.profile == 'targeted-patch'
        run: >-
          python scripts/run_release_rehearsal.py
          --contract-profile
          --output outputs/rehearsal/windows-2022
      - name: Assemble pinned offline Windows runtime
        shell: pwsh
        run: |
          python scripts/install_windows_runtime.py fetch `
            --lock scripts/windows_runtime_lock.json `
            --output "$env:RUNNER_TEMP\memory-wuxian-runtime-assets" `
            --pip-python (Get-Command python).Source
          python scripts/install_windows_runtime.py assemble `
            --lock scripts/windows_runtime_lock.json `
            --assets "$env:RUNNER_TEMP\memory-wuxian-runtime-assets" `
            --output runtime/windows
          python scripts/install_windows_runtime.py validate `
            --bundle-root runtime/windows
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build uniquely hashed Windows installer candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force candidate-dist | Out-Null
          $version = (& python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          $buildLog = (
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
              "/DSourceRoot=$PWD" `
              "/DAppVersion=$version" `
              packaging/windows/MemoryWuxian.iss 2>&1
          ) -join "`n"
          Write-Host $buildLog
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = Get-Item "dist\MemoryWuxian-$version-Windows-x64-Setup.exe"
          foreach ($required in @(
            "runtime\windows\runtime-manifest.json",
            "runtime\windows\python\python.exe",
            "scripts\install_windows_transaction.py",
            "scripts\windows_installer_broker.py"
          )) {
            $sourcePath = Join-Path $PWD $required
            if (-not $buildLog.Contains("Compressing: $sourcePath")) {
              throw "Windows candidate is missing required file: $required"
            }
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item -LiteralPath $installer.FullName -Destination candidate-dist
          [IO.File]::WriteAllText(
            "candidate-dist/$($installer.Name).sha256",
            "$hash  $($installer.Name)`n",
            [Text.UTF8Encoding]::new($false)
          )
          $provenance = [ordered]@{
            schema_version = 1
            source_commit = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            installer_name = $installer.Name
            installer_sha256 = $hash
          } | ConvertTo-Json
          [IO.File]::WriteAllText(
            "candidate-dist/candidate-provenance.json",
            "$provenance`n",
            [Text.UTF8Encoding]::new($false)
          )
      - name: Rehearse exact packaged chain on the ephemeral Windows runner
        shell: pwsh
        run: >-
          ./tests/run_windows_packaged_chain_ci.ps1
          -CandidateDir candidate-dist
          -SourceRoot .
          -OutputRoot outputs/s09-packaged-chain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-evidence-windows
          path: outputs
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-candidate
          path: candidate-dist/*
          if-no-files-found: error

  macos-candidate:
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - id: validation-profile
        shell: bash
        run: echo "profile=$(python scripts/run_release_rehearsal.py --print-validation-profile)" >> "$GITHUB_OUTPUT"
      - run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --manifest-path native-collector/Cargo.toml
      - run: cargo check --locked --all-targets --manifest-path native-collector/Cargo.toml
      - if: steps.validation-profile.outputs.profile != 'targeted-patch'
        run: cargo test --locked --manifest-path native-collector/Cargo.toml
      - run: cargo build --locked --bins --manifest-path native-collector/Cargo.toml
      - name: Build packaged macOS candidate binaries
        run: ./scripts/build_native_collector.sh
      - name: Run macOS platform contracts on pull requests
        if: github.event_name == 'pull_request' && steps.validation-profile.outputs.profile != 'targeted-patch'
        run: >-
          python -m unittest -v
          tests.test_platform_runtime
          tests.test_macos_transaction
          tests.test_auto_update
          tests.test_cloud_scheduler
      - name: Run full Python suite once on main
        if: github.event_name == 'push' && steps.validation-profile.outputs.profile != 'targeted-patch'
        shell: bash
        run: |
          mkdir -p outputs/baseline
          source_hash="$(python scripts/run_release_rehearsal.py --print-source-content-sha256)"
          printf 'SOURCE_CONTENT_SHA256=%s\n' "$source_hash" > outputs/baseline/unittest.log
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 \
            | tee -a outputs/baseline/unittest.log
      - name: Run complete macOS rehearsal on main
        if: github.event_name == 'push' && steps.validation-profile.outputs.profile != 'targeted-patch'
        run: >-
          python scripts/run_release_rehearsal.py
          --output outputs/rehearsal/macos-latest
          --exclude-baseline
          --reuse-unittest-evidence outputs/baseline/unittest.log
      - name: Run bounded patch impact rehearsal
        if: steps.validation-profile.outputs.profile == 'targeted-patch'
        run: >-
          python scripts/run_release_rehearsal.py
          --contract-profile
          --output outputs/rehearsal/macos-latest
      - uses: actions/upload-artifact@v7
        if: always() && (github.event_name == 'push' || steps.validation-profile.outputs.profile == 'targeted-patch')
        with:
          name: candidate-evidence-macos
          path: outputs

  documentation-change-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: >-
          python scripts/check_documentation_changes.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
