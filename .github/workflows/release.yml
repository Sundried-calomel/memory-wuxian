name: release-installers

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: memory-wuxian-release
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - id: release
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)b([0-9]+)$ ]]; then
            tag="v${BASH_REMATCH[1]}-beta.${BASH_REMATCH[2]}"
            prerelease="true"
          else
            tag="v$version"
            prerelease="false"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  candidate-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful candidate CI for this commit
        uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "test.yml",
                head_sha: context.sha,
                status: "completed",
                per_page: 100
              }
            );
            const proof = runs.find(
              (run) => run.event === "push" && run.conclusion === "success"
            );
            if (!proof) {
              core.setFailed(
                `Commit ${context.sha} has no successful push run of test.yml`
              );
              return;
            }
            core.notice(`Candidate evidence: ${proof.html_url}`);

  release-gate:
    if: always()
    needs: [metadata, candidate-proof]
    runs-on: ubuntu-latest
    steps:
      - name: Require candidate evidence and unused version
        shell: bash
        run: |
          test "${{ needs.metadata.result }}" = "success"
          test "${{ needs.candidate-proof.result }}" = "success"

  macos-installer:
    needs: [release-gate, metadata]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Prepare offline PKG dependency source
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build universal native binaries
        run: |
          cargo build --release --locked --bins --target aarch64-apple-darwin --manifest-path native-collector/Cargo.toml
          cargo build --release --locked --bins --target x86_64-apple-darwin --manifest-path native-collector/Cargo.toml
          mkdir -p bin
          for binary in memory-wuxian-collector memory-wuxian-envelope; do
            lipo -create \
              "native-collector/target/aarch64-apple-darwin/release/$binary" \
              "native-collector/target/x86_64-apple-darwin/release/$binary" \
              -output "bin/$binary"
          done
          chmod +x \
            bin/memory-wuxian-collector \
            bin/memory-wuxian-envelope \
            packaging/macos/build_pkg.sh \
            packaging/macos/build_dashboard_app.sh \
            packaging/macos/scripts/postinstall \
            scripts/install_dashboard_app_macos.py
          version="${{ needs.metadata.outputs.version }}"
          for binary in memory-wuxian-collector memory-wuxian-envelope; do
            actual="$(bin/$binary --version)"
            expected="$binary $version"
            if [[ "$actual" != "$expected" ]]; then
              echo "Unexpected native version: $actual != $expected" >&2
              exit 1
            fi
          done
      - name: Build PKG
        shell: bash
        env:
          PYTHON_EXECUTABLE: python
        run: |
          version="${{ needs.metadata.outputs.version }}"
          packaging/macos/build_pkg.sh "$version" dist
          if ! pkgutil --payload-files "dist/MemoryWuxian-$version-macOS-universal.pkg" \
            | grep -q "Memory無限操作台.app/Contents/MacOS/MemoryDashboard"; then
            echo "macOS package does not contain the versioned dashboard application." >&2
            exit 1
          fi
          payload="$(pkgutil --payload-files "dist/MemoryWuxian-$version-macOS-universal.pkg")"
          for required in \
            "skill/SKILL.md" \
            "skill/AGENTS.md" \
            "skill/PRODUCT_ARCHITECTURE.md" \
            "skill/docs/module-architecture.json" \
            "skill/scripts/check_architecture_contract.py"; do
            if ! grep -q "$required" <<<"$payload"; then
              echo "macOS package is missing architecture gate file: $required" >&2
              exit 1
            fi
          done
          expanded_pkg="$(mktemp -d)/expanded"
          pkgutil --expand "dist/MemoryWuxian-$version-macOS-universal.pkg" "$expanded_pkg"
          if grep -q '<relocate>' "$expanded_pkg/PackageInfo"; then
            echo "macOS package still allows bundle relocation." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: dist/*

  windows-installer:
    needs: [release-gate, metadata]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native binaries
        shell: pwsh
        run: |
          cargo build --release --locked --bins --manifest-path native-collector/Cargo.toml
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item native-collector/target/release/memory-wuxian-collector.exe bin/memory-wuxian-collector.exe -Force
          Copy-Item native-collector/target/release/memory-wuxian-envelope.exe bin/memory-wuxian-envelope.exe -Force
          Copy-Item native-collector/target/release/memory-wuxian-dashboard-launcher.exe bin/memory-wuxian-dashboard-launcher.exe -Force
          $version = "${{ needs.metadata.outputs.version }}"
          foreach ($binary in @("memory-wuxian-collector", "memory-wuxian-envelope")) {
            $actual = (& "bin\$binary.exe" --version).Trim()
            $expected = "$binary $version"
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
              throw "Unexpected native version: $actual != $expected"
            }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build EXE installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = "${{ needs.metadata.outputs.version }}"
          $buildLog = (
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
              "/DSourceRoot=$PWD" `
              "/DAppVersion=$version" `
              packaging/windows/MemoryWuxian.iss 2>&1
          ) -join "`n"
          Write-Host $buildLog
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = Get-Item "dist\MemoryWuxian-$version-Windows-x64-Setup.exe"
          foreach ($required in @(
            "SKILL.md",
            "AGENTS.md",
            "PRODUCT_ARCHITECTURE.md",
            "docs\module-architecture.json",
            "scripts\check_architecture_contract.py",
            "bin\memory-wuxian-collector.exe",
            "bin\memory-wuxian-envelope.exe",
            "bin\memory-wuxian-dashboard-launcher.exe"
          )) {
            $sourcePath = Join-Path $PWD $required
            if (-not $buildLog.Contains("Compressing: $sourcePath")) {
              throw "Windows package is missing architecture gate file: $required"
            }
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "$($installer.FullName).sha256",
            "$hash  $($installer.Name)`n",
            [Text.UTF8Encoding]::new($false)
          )
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/*

  publish:
    needs: [metadata, release-gate, macos-installer, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Build and sign governed update metadata
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.MEMORY_WUXIAN_UPDATE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        shell: bash
        run: |
          test -n "$UPDATE_SIGNING_KEY"
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key_file"
          chmod 600 "$key_file"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          dist = Path("dist")
          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          channel = "beta" if os.environ["RELEASE_PRERELEASE"] == "true" else "stable"
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          assets = {
              "windows": f"MemoryWuxian-{version}-Windows-x64-Setup.exe",
              "macos": f"MemoryWuxian-{version}-macOS-universal.pkg",
          }
          for platform_name, filename in assets.items():
              path = dist / filename
              if not path.is_file():
                  raise SystemExit(f"missing installer for metadata: {path}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              payload = {
                  "schema_version": 1,
                  "releases": [{
                      "version": version,
                      "channel": channel,
                      "full": {"url": f"{base}/{filename}", "sha256": digest, "filename": filename},
                      "deltas": [],
                  }],
              }
              output = dist / f"memory-wuxian-update-{platform_name}-v1.json"
              output.write_text(json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          for metadata in dist/memory-wuxian-update-*-v1.json; do
            ssh-keygen -Y sign -f "$key_file" -n memory-wuxian-update-v1 "$metadata"
          done
          ssh-keygen -y -f "$key_file" | grep -F 'AAAAC3NzaC1lZDI1NTE5AAAAIE8w5dUIf1OCrgKeWP+aMgbWvBimOr+b/hqaJNBd3XaL' >/dev/null
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.metadata.outputs.prerelease }}
