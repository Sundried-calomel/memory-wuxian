[package]
name = "memory-wuxian-envelope-minimal"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "memory-wuxian-envelope"
path = "src/main.rs"

[dependencies]
age = "0.12.1"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"