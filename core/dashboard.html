<body>
<header>
  <h1 id="app-title"></h1>
  <div><span id="health" class="status"></span><button id="settings-open" aria-haspopup="dialog">&#9881;</button><div class="language-control"><button id="language-toggle" aria-haspopup="menu" aria-expanded="false"><span class="language-icon" aria-hidden="true"><span class="ideograph">文</span><span class="latin">A</span></span></button><div id="language-menu" class="language-menu" role="menu"><button data-language="zh" role="menuitemradio">中文</button><button data-language="ja" role="menuitemradio">日本語</button><button data-language="en" role="menuitemradio">English</button></div></div><button id="refresh">&#8635;</button></div>
</header>
<main>
  <nav class="primary-tabs" role="tablist"><button id="archive-view-tab" class="primary-tab" role="tab" data-primary-view="archive" aria-controls="archive-view" aria-selected="true"></button><button id="search-view-tab" class="primary-tab" role="tab" data-primary-view="search" aria-controls="search-view" aria-selected="false"></button><button id="devices-view-tab" class="primary-tab" role="tab" data-primary-view="devices" aria-controls="devices-view" aria-selected="false"></button><button id="environment-view-tab" class="primary-tab" role="tab" data-primary-view="environment" aria-controls="environment-view" aria-selected="false"></button><button id="system-view-tab" class="primary-tab" role="tab" data-primary-view="system" aria-controls="system-view" aria-selected="false"></button></nav>
  <div id="archive-view" class="primary-view"><div id="archive-freshness" class="collector-alert" hidden></div>
    <section id="metrics" class="metrics"></section>
    <section class="layout"><div class="panel"><div class="chart-head"><h2 id="daily-title"></h2><div class="chart-modes" role="group"><button id="daily-messages" class="chart-mode" type="button" data-daily-mode="messages" aria-pressed="true"></button><button id="daily-tokens" class="chart-mode" type="button" data-daily-mode="reported_tokens" aria-pressed="false"></button></div></div><div id="daily-meta" class="chart-meta"></div><div id="timeline" class="timeline"></div><div id="daily-drilldown" class="chart-drilldown" hidden></div></div><div class="panel"><h2 id="levels-title"></h2><div id="levels" class="levels"></div></div></section>
    <section class="panel" style="margin-top:16px"><h2 id="collector-title"></h2><div id="collector-alerts" class="collector-alerts"></div><div id="collector" class="collector-grid"></div><h3 id="debt-title" class="debt-title"></h3><div id="debt-grid" class="debt-grid"></div></section>
    <section class="panel" style="margin-top:16px"><div class="conversation-toolbar"><h2 id="conversations-title"></h2><select id="project-filter" aria-label="Project"></select><select id="source-filter" aria-label="Source"></select><select id="device-filter" aria-label="Device"></select><div class="view-tabs" role="tablist"><button id="active-tab" class="view-tab" role="tab" data-view="active"></button><button id="archived-tab" class="view-tab" role="tab" data-view="archived"></button></div></div><div id="conversations" class="conversation-list"></div></section>
  </div>
  <div id="search-view" class="primary-view" hidden>
    <section class="panel"><form id="memory-search-form" class="search-form"><input id="memory-search-query" maxlength="500" autocomplete="off"><div class="search-modes" role="group"><button type="button" data-search-mode="hybrid" aria-pressed="true"></button><button type="button" data-search-mode="keyword" aria-pressed="false"></button><button type="button" data-search-mode="semantic" aria-pressed="false"></button></div><button id="memory-search-submit" class="search-submit" type="submit"></button></form><div id="memory-search-meta" class="search-meta"></div><div id="memory-search-results" class="search-results"></div></section>

languageToggle.onclick=()=>{const open=languageMenu.classList.toggle('open');languageToggle.setAttribute('aria-expanded',String(open))};
document.querySelectorAll('[data-language]').forEach(b=>b.onclick=()=>{language=b.dataset.language;localStorage.setItem('memory-wuxian-language',language);closeLanguageMenu();staticText();renderSettings();if(latest)render(latest);if(latestDevices)renderDevices(latestDevices);if(latestEnvironment)renderEnvironment(latestEnvironment);if(latestSystem)renderSystem(latestSystem);if(lastSearch)renderMemorySearch(lastSearch)});
document.addEventListener('click',e=>{if(!e.target.closest('.language-control'))closeLanguageMenu()});
function searchWarning(w){const partial=String(w).startsWith('semantic-coverage-partial'),tail=String(w).includes('tail-keyword-covered');return partial?({zh:'语义索引只覆盖部分归档'+(tail?'；新增内容已进行关键词搜索':''),en:'Semantic index covers part of the archive'+(tail?'; new content included by keyword search':''),ja:'意味索引は一部のみ'+(tail?'。新しい内容はキーワード検索済み':'')})[language]:({zh:'语义索引不可用，已回退关键词搜索：',en:'Semantic index unavailable; keyword fallback: ',ja:'意味索引を利用できずキーワード検索に切り替え：'})[language]+w}
function renderMemorySearch(payload){lastSearch=payload;const s=srch(),rows=payload.results||[];document.querySelector('#memory-search-meta').innerHTML=`<span>${esc(s.found(payload.count||0))}</span><span>${payload.verified_against_raw?esc(s.verified):''}</span>${(payload.warnings||[]).map(w=>`<span class="chart-warning">${esc(searchWarning(w))}</span>`).join('')}`;document.querySelector('#memory-search-results').innerHTML=rows.map(row=>{const text=String(row.text||''),preview=text.length>420?text.slice(0,420)+'…':text,when=row.timestamp?new Date(row.timestamp).toLocaleString(tr().locale):tr().none,source=`${row.raw_path||''}:${row.raw_line_start||'?'}-${row.raw_line_end||'?'}`;return`<article class="search-result"><div class="search-result-head"><div><h3>${esc(row.conversation_title||row.conversation_id)}</h3><span class="label">${esc(s.speaker)}: ${esc(row.speaker||row.record_type||tr().none)} · ${esc(s.time)}: ${esc(when)}</span></div><b>${esc(s.score)} ${Math.round((row.score||0)*100)}%</b></div><p class="search-result-text">${esc(preview)}</p><details><summary>${esc(s.expand)}</summary><p class="search-result-text">${esc(text)}</p><div class="search-source">${esc(s.source)}: ${esc(source)}<br>SHA-256: ${esc(row.record_sha256||'')}</div></details></article>`}).join('')||`<div class="empty">${esc(s.empty)}</div>`}
async function runMemorySearch(){const query=document.querySelector('#memory-search-query').value.trim(),button=document.querySelector('#memory-search-submit'),s=srch();if(!query)return;button.disabled=true;document.querySelector('#memory-search-meta').textContent=s.searching;document.querySelector('#memory-search-results').innerHTML='';try{const response=await fetch(`/api/memory-search?q=${encodeURIComponent(query)}&mode=${encodeURIComponent(searchMode)}&limit=20`,{cache:'no-store'}),payload=await response.json();if(!response.ok)throw new Error(payload.error||response.status);renderMemorySearch(payload)}catch(error){document.querySelector('#memory-search-meta').textContent=`${s.failed}: ${error}`;document.querySelector('#memory-search-results').innerHTML=''}finally{button.disabled=false}}
document.querySelector('#memory-search-form').onsubmit=e=>{e.preventDefault();runMemorySearch()};
document.querySelectorAll('[data-search-mode]').forEach(button=>button.onclick=()=>{searchMode=button.dataset.searchMode;document.querySelectorAll('[data-search-mode]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))});
document.querySelectorAll('[data-daily-mode]').forEach(button=>button.onclick=()=>{dailyMode=button.dataset.dailyMode;localStorage.setItem('memory-wuxian-daily-mode',dailyMode);if(latest)renderDailyChart(latest)});
document.querySelector('#timeline').addEventListener('click',event=>{const bar=event.target.closest('[data-daily-date]');if(!bar)return;selectedDailyDate=selectedDailyDate===bar.dataset.dailyDate?null:bar.dataset.dailyDate;if(latest)renderDailyChart(latest)});
document.querySelector('#timeline').addEventListener('keydown',event=>{if(!['Enter',' '].includes(event.key))return;const bar=event.target.closest('[data-daily-date]');if(!bar)return;event.preventDefault();bar.click()});
document.querySelector('#refresh').onclick=()=>load(true);
document.querySelector('#environment-process').onclick=processEnvironment;
document.querySelector('#environment-profile-peer').onchange=e=>{document.querySelector('#environment-profile-compare').disabled=!e.target.value;document.querySelector('#environment-profile-comparison').innerHTML=''};
document.querySelector('#environment-profile-compare').onclick=compareEnvironmentProfiles;
connectEvents();
document.querySelector('#settings-open').onclick=()=>{renderSettings();document.querySelector('#settings-dialog').showModal();load(false).then(()=>{if(document.querySelector('#settings-dialog').open)renderSettings()})};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.querySelector('#'+b.dataset.close).close());
document.querySelector('#settings-list').addEventListener('change',e=>{if(e.target.dataset.setting)saveSetting(e.target);if(e.target.hasAttribute('data-cloud-toggle'))runCloudAction(e.target.checked?'enable':'disable')});
document.querySelector('#settings-list').addEventListener('change',e=>{if(e.target.hasAttribute('data-chatgpt-file')){const file=e.target.files?.[0];if(file)runChatGPTImport(file)}});
document.querySelector('#settings-list').addEventListener('click',e=>{const action=e.target.closest('[data-cloud-action]')?.dataset.cloudAction;if(action)runCloudAction(action);if(e.target.closest('[data-chatgpt-import]'))document.querySelector('[data-chatgpt-file]')?.click()});
document.querySelectorAll('[data-primary-view]').forEach(b=>b.onclick=()=>selectPrimaryView(b.dataset.primaryView));
staticText();selectPrimaryView(primaryView);renderSettings();applySettings();if(!latest)document.querySelector('#health').textContent=tr().loading;load().then(refreshColdSnapshot);
document.querySelectorAll('.view-tab').forEach(b=>b.onclick=()=>{conversationView=b.dataset.view;if(latest)renderConversations(latest,tr())});
const renderDevicesWithEvidenceOwners=renderDevices;
renderDevices=d=>{
  renderDevicesWithEvidenceOwners(d);
  const t=tr(),g=fed(),stream=d.cloud?.streams?.['project-attachment-v1']||{},owners=stream.owners?.owners||[];
  document.querySelector('#evidence-owners-title').textContent=g.evidenceOwners;
  const button=document.querySelector('#evidence-owners-refresh');
  button.textContent=g.refreshOwners;
  button.title=g.refreshOwners;
  document.querySelector('#evidence-owner-list').innerHTML=owners.map(owner=>`<article class="environment-row"><div class="identity"><b>${esc(owner.title||owner.project_id)}</b><span class="label">${esc(owner.project_id)}</span></div><div><span class="label">${g.selectedFiles}</span><b>${fmt(owner.selected_files)}</b></div><div><span class="label">${g.currentGeneration}</span><b>${esc(owner.current_generation_id||t.none)}</b></div><div><span class="status-tag ${owner.attention?'attention':'ok'}">${esc(owner.attention||g.ready)}</span></div></article>`).join('')||`<div class="empty">${esc(g.emptyOwners)}</div>`;
};
async function refreshEvidenceOwners(){
  const button=document.querySelector('#evidence-owners-refresh'),g=fed();
  button.disabled=true;
  try{
    const response=await fetch('/api/project-evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'refresh-owners'})}),payload=await response.json();
    if(!response.ok)throw new Error(payload.error||response.status);
    latestDevices=payload.devices;
    renderDevices(payload.devices);
    showSystemToast(g.ownerActionDone,`${payload.result.created||0} / ${payload.result.unchanged||0}`);
  }catch(error){showSystemToast(g.ownerActionFailed,String(error))}
  finally{button.disabled=false}
}
document.querySelector('#evidence-owners-refresh').onclick=refreshEvidenceOwners;
</script>
</body>
</html>
